name: Build IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned)
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project SecureVault.xcodeproj -scheme SecureVault \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log
      - name: Publish build log
        if: always()
        run: |
          mkdir -p /tmp/logs && cp build.log /tmp/logs/build.log 2>/dev/null || echo "no log" > /tmp/logs/build.log
          grep -E "error:|warning: unable|BUILD (SUCCEEDED|FAILED)" build.log > /tmp/logs/errors.txt 2>/dev/null || true
          cd /tmp/logs && git init -q -b build-logs && git config user.name ci && git config user.email ci@example.com
          git add -A && git commit -qm "build log $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" build-logs
      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SecureVault.app Payload/
          test -f Payload/SecureVault.app/SecureVault
          zip -qr SecureVault.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SecureVault-ipa
          path: SecureVault.ipa
      - name: Publish release (direct download)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest SecureVault.ipa --title "Khizana latest build" --notes "Unsigned IPA. Install with Sideloadly or AltStore."
