name: SecureVault
options:
  bundleIdPrefix: com.securevault
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: ar
  createIntermediateGroups: true
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.1.0
targets:
  SecureVault:
    type: application
    platform: iOS
    sources:
      - path: SecureVault
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.securevault.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_LANGUAGE: ar
    info:
      path: SecureVault/Info.plist
      properties:
        CFBundleDisplayName: خِزانة
        CFBundleDevelopmentLanguage: ar
        CFBundleLocalizations: [ar, en, fr, es, tr, ur]
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSFaceIDUsageDescription: يستخدم التطبيق Face ID لفتح الخزنة بأمان.
        NSPhotoLibraryUsageDescription: يحتاج التطبيق إلى الوصول لمكتبة الصور لاستيراد الصور والفيديوهات إلى الخزنة.
        GIDClientID: YOUR_CLIENT_ID
        CFBundleURLTypes:
          - CFBundleURLSchemes: [YOUR_REVERSED_CLIENT_ID]
